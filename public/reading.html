<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全文证据 · 具身研究台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/reading.css"><script defer src="/reading.js"></script><link rel="stylesheet" href="/reader.css"></head><body><main class="reading-page"><a href="/" id="back-to-research" class="text-button">← 返回这篇手记</a><header><h1 id="title">全文证据</h1></header><section id="analysis" class="reading-panel" hidden></section><section class="reading-panel"><div class="reading-actions"><button class="btn" id="queue-entry">查看后台处理</button><button class="btn primary" id="prepare">准备全文证据</button><button class="btn" id="analyze" disabled>生成有出处的解读</button><button class="btn" id="refresh">检查状态</button></div><p id="status" role="status" aria-live="polite">正在读取状态…</p><p id="model-state"></p><p class="evidence-note">支持 arXiv 论文及已配置官方来源的发布正文、模型卡、数据集卡和技术文章，原文保留来源语言。表格、公式或图片可能提取不完整，请按链接回到原文核对。</p></section><section class="reading-panel"><label for="search"><strong>检索原文</strong></label><input type="search" id="search" placeholder="如 ablation、failure、data…"><p id="count"></p><div id="passages"></div></section><dialog id="quote-dialog"><div class="reading-panel"><h2>引用原文</h2><p>复制以下 Markdown 到精读笔记，并补充自己的理解。</p><textarea id="quote" readonly aria-label="引用内容"></textarea><button class="btn" id="copy">复制引用</button><button class="btn" id="close-quote">关闭</button><p id="copy-state" role="status"></p></div></dialog></main></body></html>
