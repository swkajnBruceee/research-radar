<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开你的研究台</title><link rel="icon" href="/radar.svg"><link rel="stylesheet" href="/styles.css"><script defer src="/login.js"></script><style>.login{width:min(390px,90vw);margin:14vh auto;background:#fff;padding:32px;border:1px solid #e0e7d7;border-radius:16px}.login h1{font-size:23px;margin:24px 0 12px}.login p{font-size:13px;line-height:1.8;color:#71806b}.login input{letter-spacing:.1em;font-size:18px}.login .btn{width:100%}.error{font-size:12px;color:#9b523b;min-height:26px;margin:10px 0}.login .logo-mark{width:44px;height:44px}</style></head><body><main class="login"><div class="logo-mark"></div><h1>打开你的研究台</h1><p>输入这台 Mac 的访问码，继续阅读、记录和探索。</p><form id="login-form"><div class="field"><label for="access-code">访问码</label><input type="password" id="access-code" required autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx"></div><div id="error" class="error" role="alert"></div><button id="submit" class="btn primary" type="submit">进入研究台 →</button></form><p>访问码可在 Mac 的配对页查看。使用 HTTPS 地址可跨网络连接，Mac 需保持在线。</p></main></body></html>
