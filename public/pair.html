<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接手机 · 具身研究台</title><link rel="stylesheet" href="/styles.css"><script defer src="/vendor/qrcode.js"></script><script defer src="/pair.js"></script>
<style>
.pair{max-width:620px;margin:5vh auto;padding:24px}.pair h1{font-size:28px;margin:20px 0 12px}.pair p{line-height:1.7;margin:12px 0;color:#53614f}.pair section{background:white;padding:24px;border:1px solid #dfe6d6;border-radius:20px}.pair h2{font-size:18px;margin:20px 0 8px}.pair code{overflow-wrap:anywhere;font-size:14px}.pair .btn{margin:6px 0;min-height:44px}.pair nav{display:flex;gap:8px;flex-wrap:wrap}.pair nav button[aria-pressed=true]{background:#e8efe3;border-color:#63785e}.pair nav button:disabled{opacity:.5}.pair .address{display:block;color:inherit;overflow-wrap:anywhere;padding:14px;background:#f6f7f3;border-radius:10px;text-decoration:underline}#qr{background:white;padding:8px;margin:16px auto;width:240px;max-width:100%}#qr svg{max-width:100%;height:auto}.pair small{display:block;line-height:1.7;color:#6a7366}.pair .steps{padding-left:22px;line-height:1.9}.pair .code-block{border-top:1px solid #e8ebe4;margin-top:24px;padding-top:4px}.pair a:focus-visible,.pair button:focus-visible{outline:3px solid #53614f;outline-offset:3px}@media(max-width:440px){.pair{padding:16px;margin:12px auto}.pair section{padding:20px}}
</style></head><body><main class="pair"><a href="/">← 返回研究台</a><h1>在手机上继续读</h1><p>扫描二维码，打开研究台。论文、笔记和阅读进度与你的 Mac 同步。</p><section>
<nav aria-label="选择连接方式"><button id="remote-mode" class="btn" aria-pressed="false" disabled>跨网络 · HTTPS</button><button id="local-mode" class="btn" aria-pressed="false">同一网络</button></nav>
<p id="status" role="status">正在读取连接信息…</p><nav aria-label="二维码用途"><button id="app-qr" class="btn" aria-pressed="true">App 配对码</button><button id="web-qr" class="btn" aria-pressed="false">Safari 网页码</button></nav><div id="qr" aria-label="研究台 App 配对二维码"></div><a id="address" class="address" target="_blank" rel="noopener"></a><small id="connection-note"></small>
<ol class="steps"><li id="scan-step">在 App 的“连接设置”中扫码，识别后会填入地址。</li><li id="code-step">输入这台 Mac 上的访问码，再点“保存并连接”。扫码不会自动登录。</li></ol>
<p><a id="invitation" class="btn">已安装 App？使用这个连接</a></p><small>App 也可在“连接设置”中粘贴上方地址。二维码和链接均不包含访问码。</small>
<div id="alternatives" hidden></div><div class="code-block"><h2>访问码</h2><button id="show-code" class="btn">在这台 Mac 查看</button><p id="code" hidden aria-live="polite"></p><small>仅 Mac 本机可查看，也可打开项目中的 data/access-code.txt。</small></div>
</section></main></body></html>
